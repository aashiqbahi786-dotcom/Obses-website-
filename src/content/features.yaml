# Feature pages. status: available | coming-soon
# Truth rule: only facts from the founder brief. Coming-soon items never claim availability.

brainstorm-and-build-modes:
  order: 4
  status: available
  title: Brainstorm and Build modes
  shortTitle: Brainstorm and Build
  metaTitle: Brainstorm and Build Modes — Plan First, Then Build
  description: Talk through your idea in Brainstorm mode, then switch to Build mode and let the AI write the app. Replies come in your own language.
  icon: messages-square
  summary: Plan and discuss your idea first, then let the AI build it.
  answer: >-
    Obsess has two chat modes. Brainstorm mode is for planning: you discuss the idea, pages and
    features with the AI without changing any code. Build mode is where the AI writes the app.
    Both reply in your language and script, so you can think out loud in Hinglish, Hindi or Banglish.
  sections:
    - q: Why plan before building?
      a: A clear plan means fewer changes later. In Brainstorm mode you can ask questions, compare ideas and agree on what to build before any credits go into building.
    - q: When should I switch to Build mode?
      a: When you know what the first version should do. Switch to Build and the AI starts writing the app.
    - q: Which languages does the AI reply in?
      a: The language and script you write in, including Hinglish, Hindi in Devanagari, Banglish and English.
  related: [website-builder, mobile-app-builder, credit-estimate-before-every-task]
  faq:
    - q: Does Brainstorm mode change my app?
      a: No. Brainstorm is for discussion and planning. Changes to the app happen in Build mode.

photo-to-app:
  order: 5
  status: available
  title: Photo to app
  shortTitle: Photo to app
  metaTitle: Photo to App — Turn a Screenshot into an App
  description: Upload a photo or screenshot of a design you like and ask Obsess to build an app or website that looks like it.
  icon: image
  summary: Upload a photo or screenshot and get an app that looks like it.
  answer: >-
    Photo to app lets you show Obsess what you want instead of describing every detail. Upload a
    photo or screenshot of a screen you like, a sketch or another app, and ask for an app or
    website that looks like it. The AI uses the image as a guide and builds a working version.
  sections:
    - q: How does photo to app work?
      a: Attach an image in the chat and say what you want, for example "make my menu page look like this". The AI reads the layout and colours and builds a similar screen.
    - q: What images work best?
      a: Clear screenshots or photos where the layout is easy to see. A hand-drawn sketch on paper can also work as a starting point.
  limits:
    - The result is a similar design, not a pixel-perfect copy.
    - Only use images you have the right to use.
  related: [voice-and-pdf-input, website-builder, mobile-app-builder]
  faq:
    - q: Can I copy another company's app exactly?
      a: Use images as inspiration for your own design. Do not copy another brand's logo, name or content.

voice-and-pdf-input:
  order: 6
  status: available
  title: Voice and PDF input
  shortTitle: Voice and PDF input
  metaTitle: Build an App by Voice or from a PDF — Obsess
  description: Speak your idea or upload a PDF such as a menu or price list. Obsess uses it to build your website or app. Web search is used only when needed.
  icon: mic
  summary: Speak your idea or attach a PDF — a menu, a price list, a brief.
  answer: >-
    Obsess accepts more than typed text. You can speak your request with voice input, or attach a
    PDF document such as a menu, price list or project brief, and the AI uses it while building.
    Web search is used only when a task needs live facts, so your request stays focused.
  sections:
    - q: Can I describe my app by voice?
      a: Yes. Use the microphone in the chat and speak your request. This helps when typing on a phone is slow.
    - q: What can I do with a PDF?
      a: Attach documents with your real details — a menu, a product list, opening hours — so the AI can put them into your site instead of placeholder text.
    - q: Does Obsess search the web?
      a: Only when the task needs live facts. Most building does not need it.
  related: [photo-to-app, brainstorm-and-build-modes, website-builder]
  faq:
    - q: Which languages can I speak in?
      a: Speak the way you normally would. The AI replies in the language and script you use.

live-preview-version-history-undo:
  order: 7
  status: available
  title: Live preview, version history and Undo
  shortTitle: Preview, history and Undo
  metaTitle: Live Preview, Version History and One-Tap Undo
  description: See every change in a live preview. Each change is checked before it is saved, kept in version history, and one tap undoes it.
  icon: history
  summary: See changes live, keep every version, undo with one tap.
  answer: >-
    Every change Obsess makes appears in a live preview, so you see the result before you publish.
    Each change is checked with a typecheck and a build before it is saved, kept in version
    history, and can be reversed with one tap. You can try ideas freely without losing a version that worked.
  sections:
    - q: What does "checked before it is saved" mean?
      a: Before a change is stored, Obsess runs a typecheck and a build. A change that breaks the build is not saved as a new version.
    - q: How do I go back to an older version?
      a: Use Undo to reverse the last change, or pick an earlier version from the history.
    - q: How is an Android app previewed?
      a: Inside a phone frame in the builder.
  related: [fix-with-ai, web-app-builder, mobile-app-builder]
  faq:
    - q: Does a passing build mean the app is perfect?
      a: No. It means the code compiles and builds. Always try the preview yourself; if something breaks at runtime, use Fix with AI.

fix-with-ai:
  order: 8
  status: available
  title: Fix with AI
  shortTitle: Fix with AI
  metaTitle: Fix with AI — One Tap to Repair Preview Errors
  description: When the live preview shows a runtime error, tap Fix with AI and Obsess reads the error and repairs the app for you.
  icon: wand-sparkles
  summary: When the preview shows an error, one tap asks the AI to fix it.
  answer: >-
    Fix with AI is a button that appears when your live preview hits a runtime error. Instead of
    copying error messages, you tap it and Obsess reads the error, changes the code and checks the
    fix with a typecheck and a build before saving. It is made for people who never want to read a stack trace.
  sections:
    - q: What kind of errors can it fix?
      a: Runtime errors that show up in the preview, such as a screen that crashes when you tap something.
    - q: What if the fix does not work?
      a: Undo the change with one tap, describe what you see in the chat, and try again.
  limits:
    - Not every error can be fixed automatically; describing the problem in the chat helps.
  related: [live-preview-version-history-undo, web-app-builder]
  faq:
    - q: Does Fix with AI use credits?
      a: Fixes are tasks like any other, and you see a credit estimate before a task runs.

publish-and-hosting:
  order: 9
  status: available
  title: Publish and hosting
  shortTitle: Publish and hosting
  metaTitle: Publish Your App in One Tap — Free Address
  description: Publish your website or app to a free address in one tap, with SEO basics, rollback and unpublish. A security scan runs before publishing.
  icon: cloud-upload
  summary: One tap to a free address, with SEO basics, rollback and unpublish.
  answer: >-
    When your app looks right, Obsess publishes it to a free web address in one tap. Published
    sites get SEO basics, and you can roll back to an earlier version or unpublish at any time.
    Before anything goes live, a pre-publish security scan checks for leaked secret keys and phishing-like pages.
  sections:
    - q: How do I publish my app?
      a: Tap Publish. The security scan runs, and if it passes, your app goes live at a free address you can share.
    - q: Can I take my app down?
      a: Yes. Unpublish at any time, or roll back to an earlier published version.
    - q: Can I use my own domain?
      a: Yes. On the Pro plan and above, connect your own domain with one DNS record; SSL is automatic.
  related: [pre-publish-security-scan, custom-domains, website-builder]
  faq:
    - q: Did publishing work in testing?
      a: In our internal eval, 16 of 16 verified eval apps published successfully. See Benchmarks for details and limits.

pre-publish-security-scan:
  order: 10
  status: available
  title: Pre-publish security scan
  shortTitle: Security scan
  metaTitle: Pre-Publish Security Scan — Safer Publishing
  description: Before your app goes live, Obsess blocks leaked secret keys and holds phishing-like pages for review, to protect you and your visitors.
  icon: shield-check
  summary: Blocks leaked secret keys and holds phishing-like pages for review.
  answer: >-
    Every publish on Obsess passes a security scan first. The scan blocks publishing when it finds
    leaked secret keys, such as a private API key pasted into the code, and holds pages that look
    like phishing for review. It protects you from leaking keys and keeps the free address safe for visitors.
  sections:
    - q: What happens if a secret key is found?
      a: Publishing is blocked until the key is removed from the code.
    - q: Why are some pages held for review?
      a: Pages that look like phishing — for example, fake login pages — are held so people cannot misuse the platform.
  related: [publish-and-hosting, website-builder]
  faq:
    - q: Does the scan make my app fully secure?
      a: No scan can promise that. It catches common, serious mistakes before they go live.

credit-estimate-before-every-task:
  order: 11
  status: available
  title: Credit estimate before every task
  shortTitle: Credit estimate
  metaTitle: Credit Estimate Before Every Task — Clear AI Cost
  description: See how many credits a task will cost before it runs. You pay by task size, so small changes cost less than big builds.
  icon: calculator
  summary: See the cost before a task runs; pay by task size.
  answer: >-
    Obsess shows a credit estimate before every task, so you know the cost before the AI starts.
    You pay by task size: a small text change costs less than building a new app. This keeps
    spending predictable, which matters when you are testing an idea or running a small business on a tight budget.
  sections:
    - q: How are credits counted?
      a: A task costs at least 0.5 credit, is rounded up in steps of 0.5, and costs at most 60 credits. See Pricing.
    - q: Can I decide not to run a task?
      a: Yes. The estimate appears before the task runs.
  related: [brainstorm-and-build-modes, fix-with-ai]
  faq:
    - q: Is the estimate exact?
      a: It is an estimate shown before the task. The exact rules are on the Pricing page.

# ---------- Launch, grow and own (founder 2026-11-20: shown as available) ----------

launchpad:
  order: 12
  status: available
  title: Launchpad — showcase your product and get early users
  shortTitle: Launchpad showcase
  metaTitle: Launchpad — Showcase Your App, Get Feedback and Users
  description: Showcase the product you built on Obsess Launchpad. Visitors explore and test it, leave ratings and feedback, and become your first users.
  icon: rocket
  summary: Showcase your product, collect reviews and find early users for your MVP.
  answer: >-
    Launchpad is where products built with Obsess get seen. You list your published app with a
    name, description, screenshots and a live demo link, and it appears in the Launchpad discovery
    feed. Visitors explore and test it, leave ratings and feedback, and you read everything in your
    creator dashboard — real early users for your MVP.
  sections:
    - q: How do I showcase my product?
      a: Publish your app, open Launchpad and add a name, description, screenshots, a live demo link, a category and who it is for. After a quick safety check, your listing goes live in the discovery feed.
    - q: How do I get reviews and feedback?
      a: Visitors open your live demo, try it and leave a rating and written feedback. You see all of it in your creator dashboard, so you know what to fix next.
    - q: Can I test my MVP with early users?
      a: Yes. Launchpad is built for that — people who browse the feed try new products and tell you what works. Use their feedback to improve before a bigger launch.
    - q: How long does my listing stay up?
      a: 7 days on the Launch plan and 14 days on the Scale plan.
    - q: Are reviews real?
      a: Only signed-in users with real activity can review, one review per person per listing, and unusual bursts of reviews are checked.
  limits:
    - Launchpad brings visibility and feedback; it does not guarantee users, leads or sales.
  related: [ads-promotion, publish-and-hosting, website-builder]
  faq:
    - q: Which plans include Launchpad?
      a: Launch (7 days) and Scale (14 days).
    - q: Is every listing checked?
      a: Yes. The live link must work, be safe and match the description. Phishing or misleading listings are removed.

ads-promotion:
  order: 13
  status: available
  title: Free ads promotion for your app
  shortTitle: Free ads promotion
  metaTitle: Free Ads Promotion — Promote Your App Inside Obsess
  description: Paid plans include a promotion coupon. Use it to run a promoted campaign for your published app inside Obsess and reach new people.
  icon: megaphone
  summary: Promotion coupons on paid plans to promote your app inside Obsess.
  answer: >-
    Every paid Obsess plan includes a promotion coupon — free ad credit for your own product. Pick a
    published app, choose its category and audience, apply the coupon, and Obsess shows it as a
    clearly labelled promoted card to people using the builder and to Launchpad visitors. Promotion
    is reviewed first, so every card stays safe and honest.
  sections:
    - q: How do I promote my app?
      a: Select a published project, set the goal, category and audience, apply your coupon from the wallet and submit. After review, the campaign goes live.
    - q: Where is my promotion shown?
      a: As a promoted card inside Obsess — after an AI reply or while a long task runs — never covering code, preview or errors, and always labelled "Promoted". Clicks lead to your Launchpad page or your app.
    - q: Is it really free?
      a: The promotion coupon is included with Starter, Pro, Launch and Scale plans. You do not pay extra for that coupon.
  limits:
    - Promotion increases visibility; it does not guarantee clicks, leads or sales.
  related: [launchpad, publish-and-hosting]
  faq:
    - q: Who sees promoted cards?
      a: People on the Free plan see promoted cards in safe places in the builder. Paid plans are ad-free.
    - q: Can anything be promoted?
      a: No. Every campaign is reviewed, and unsafe or misleading products are rejected.

smart-code-graph:
  order: 14
  status: available
  title: Smart code graph — fewer tokens, lower cost
  shortTitle: Smart code graph
  metaTitle: Smart Code Graph — Fewer Tokens, Lower AI Cost
  description: Obsess maps your project as a code graph, so the AI reads only the code that matters — fewer tokens, fewer mistakes and lower cost per task.
  icon: waypoints
  summary: A map of your code so the AI reads only what matters — fewer tokens, lower cost.
  answer: >-
    Obsess keeps a live graph of your project — every file, component, function and import, and how
    they connect. Instead of sending the whole project to the AI, it sends only the code a task
    needs. That means fewer tokens, lower cost per task, and an AI that checks its claims against
    your real code before saying "done".
  sections:
    - q: How does the code graph reduce tokens?
      a: Context Retrieval picks only the files and functions related to your request, and three levels of cache avoid paying twice for the same work. The AI reads less, so each task costs less.
    - q: How does it stop AI mistakes?
      a: Hallucination Guard checks that the files, functions and imports the AI talks about really exist. Scope Lock keeps edits inside the files a task should touch.
    - q: How does it protect the rest of my app?
      a: Impact Analysis shows which files, functions and tests a change affects before it is made.
    - q: Does Obsess remember my project?
      a: Yes. Project Memory keeps key decisions about your app, and saves long-term notes only when you confirm them.
    - q: Do I need to set anything up?
      a: No. The graph updates automatically every time a file changes.
  related: [credit-estimate-before-every-task, live-preview-version-history-undo, web-app-builder]
  faq:
    - q: How much does it save?
      a: We measure savings with the graph on and off on real tasks and will publish the results on the Benchmarks page with their date and method.

app-backends:
  order: 15
  status: available
  title: App backends — database and login
  shortTitle: App backends
  metaTitle: App Backends — Database and Login for Your Apps
  description: Give the apps you build a real database, user login and file storage. Obsess sets it up for you when you publish — no backend skills needed.
  icon: database
  summary: A real database, user login and storage for your apps.
  answer: >-
    Obsess gives the apps you build a real backend: a database, user login, file storage and live
    updates. While you build, the preview runs with its own test database. When you publish, Obsess
    creates the production backend and applies your data structure automatically, so your app can
    save orders, bookings or notes.
  sections:
    - q: Can my app save data and have user logins?
      a: Yes. Describe what your app should save and who can sign in. Obsess builds the tables, login and rules for you.
    - q: Is my preview data the same as live data?
      a: No. The preview uses a temporary test database. Your live app gets its own production backend when you publish.
    - q: Can I move the backend to my own account?
      a: Yes. You can transfer the backend project to your own account, so billing and control move to you.
  related: [web-app-builder, obsess-ai-for-apps, export]
  faq:
    - q: Which backend does Obsess use?
      a: A managed Postgres backend with authentication, storage and realtime.

obsess-ai-for-apps:
  order: 16
  status: available
  title: Obsess AI for apps
  shortTitle: Obsess AI for apps
  metaTitle: Obsess AI for Apps — AI Features Without an API Key
  description: Add AI features such as a chat assistant or summaries to the apps you build, without signing up for an AI provider or managing an API key.
  icon: sparkles
  summary: AI features in your app without your own API key.
  answer: >-
    Obsess AI for apps lets the apps you build use AI — a chat assistant, text summaries, smart
    search — without signing up for an AI provider or handling an API key. Just ask for the AI
    feature in the chat, and Obsess wires it in securely. Usage is counted in your Obsess credits.
  sections:
    - q: Why is this useful?
      a: Getting and protecting an API key is hard for non-coders, and a leaked key can cost money. Obsess handles the key for you, on the server.
    - q: What AI features can I add?
      a: Chat assistants, summaries, rewriting, classification and similar text features.
  related: [app-backends, ai-agent-builder, web-app-builder]

custom-domains:
  order: 17
  status: available
  title: Custom domains
  shortTitle: Custom domains
  metaTitle: Custom Domains for Your Obsess App — Auto SSL
  description: Connect your own domain to a website or app you published with Obsess. Add one DNS record and SSL is set up automatically.
  icon: link
  summary: Your own domain on your published app, with automatic SSL.
  answer: >-
    Every published Obsess app gets a free address, and on the Pro plan and above you can connect
    your own domain, such as yourbusiness.com. Add the DNS record Obsess shows you, and the domain is
    verified and secured with SSL automatically. Your visitors see your brand, not ours.
  sections:
    - q: How do I connect my domain?
      a: Open your published app, choose Custom domain, enter your domain and add the DNS record shown at your registrar. Obsess verifies it and turns on SSL.
    - q: Which plans include custom domains?
      a: Pro, Launch and Scale.
  related: [publish-and-hosting, export]

export:
  order: 18
  status: available
  title: Export — zip and GitHub
  shortTitle: Export
  metaTitle: Export Your App as Zip or to GitHub — Own Your Code
  description: Download your app's code as a zip file or send it to GitHub. Your app, your code, your data — move it to your own accounts any time.
  icon: download
  summary: Download your code as a zip or send it to GitHub.
  answer: >-
    With Obsess you own what you build. Download your app's full source code as a zip file or send
    it to GitHub, hand it to a developer, or host it anywhere. Backends can be transferred to your
    own account too, so your app, your code and your data are never locked in.
  sections:
    - q: How do I export my app?
      a: Open the project, choose Export, then download a zip or connect GitHub and push the code to your repository.
    - q: Why does ownership matter?
      a: You can leave any time with everything you built. That is one of the reasons Obsess exists.
  related: [app-backends, custom-domains]

visual-editor:
  order: 19
  status: available
  title: Visual editor
  shortTitle: Visual editor
  metaTitle: Visual Editor — Click to Change Your App
  description: Click on any part of your app in the preview to change its text, colours or layout directly — no prompt needed for small edits.
  icon: mouse-pointer-click
  summary: Click on the preview to change text, colours and layout.
  answer: >-
    The Obsess visual editor lets you change your app by clicking on it. Select any part of the live
    preview to edit its text, colours or layout directly, without typing a request. Small edits are
    instant; bigger changes still go through the chat, where the AI builds and checks them.
  sections:
    - q: When should I use the visual editor instead of the chat?
      a: For quick fixes — a typo, a colour, spacing. Use the chat for new pages, features or logic.
    - q: Are visual edits saved in history?
      a: Yes. Every change goes into version history and can be undone with one tap.
  related: [live-preview-version-history-undo, website-builder]

android-apk-play-store-publishing:
  order: 20
  status: available
  title: Android APK and Play Store publishing
  shortTitle: APK and Play Store
  metaTitle: Android APK and Play Store Publishing — Obsess
  description: Download an installable APK of your Android app, build an AAB for Google Play and publish through your own developer account.
  icon: package
  summary: Download an APK and publish to Google Play.
  answer: >-
    When your Android app is ready, Obsess builds an installable APK you can share directly and an
    AAB for Google Play, and publishes through your own Google Play developer account. Small changes
    reach your users as instant over-the-air updates, so you only rebuild when the app's native
    parts change.
  sections:
    - q: How do I install my app on a phone?
      a: Tap Build, download the APK and open it on an Android phone, or share the download link.
    - q: How do I publish to the Play Store?
      a: Connect your Google Play developer account. Obsess builds the AAB, signs it securely and submits it.
    - q: Do I need a new build for every change?
      a: No. Most changes ship as over-the-air updates without a new build.
  related: [mobile-app-builder]
