  promptEnglish: I have a clothing shop. Build a website with categories for kurtas, sarees and shirts, with prices.
  features: [website-builder, photo-to-app, live-preview-version-history-undo, publish-and-hosting]
  faq:
    - q: Can customers place orders?
      a: Yes. App backends let your site save orders, and customers can also reach you by call or WhatsApp.

creators:
  order: 7
  title: Websites for creators
  shortTitle: Creators
  metaTitle: Creator Website and Link Page — Build by Chat
  description: Build a personal site or link page for your channel, portfolio or brand deals. Describe your style, add a screenshot you like, publish.
  icon: video
  answer: >-
    Obsess helps creators build a personal website, portfolio or link page by chatting. Describe
    your channel, style and links, or upload a screenshot of a design you like, and the AI builds a
    page that feels like you. Preview it on your phone, change anything in the chat and publish in one tap.
  problem: Creators want a page that looks like their brand, not a generic link list, without paying a designer.
  builds:
    - Personal site or link page
    - Portfolio of your best work
    - Brand-deal and contact section
  promptHinglish: Main ek food creator hu YouTube aur Instagram pe. Mere liye ek stylish link page banao, mere top videos ke saath.
  promptEnglish: I'm a food creator on YouTube and Instagram. Build me a stylish link page with my top videos.
  features: [website-builder, photo-to-app, publish-and-hosting]

students:
  order: 8
  title: Websites and apps for students
  shortTitle: Students
  metaTitle: Build Apps for College Projects Without Coding
  description: Build a portfolio, a project app or an Android app for college by describing it. Learn by seeing the AI plan and build in your language.
  icon: graduation-cap
  answer: >-
    Obsess helps students build portfolios, project apps and Android apps by describing them. Use
    Brainstorm mode to plan the idea with the AI in your own language, then switch to Build mode and
    watch it come together in a live preview. It is a fast way to turn a project idea into something you can show.
  problem: Students have ideas and deadlines but not always the coding skills or time to build them.
  builds:
    - Portfolio website
    - A web app or Android app for a project idea
    - A landing page for a club or event
  promptHinglish: College project ke liye ek Android app chahiye jo attendance track kare. Pehle plan discuss karte hai.
  promptEnglish: I need an Android app for a college project that tracks attendance. Let's discuss the plan first.
  features: [brainstorm-and-build-modes, mobile-app-builder, web-app-builder]
  faq:
    - q: Can my app save attendance data?
      a: Yes. App backends give your app a real database, so attendance is saved.

startup-mvp:
  order: 9
  title: Build a startup MVP without coding
  shortTitle: Startup MVPs
  metaTitle: Build a Startup MVP Without Coding — Obsess
  description: Turn a startup idea into a clickable web app or Android app you can show to users and investors, by describing it in plain words.
  icon: rocket
  answer: >-
    Obsess helps founders turn an idea into a working first version, a web app or Android app you
    can show to users. Plan it in Brainstorm mode, build it in Build mode, see the cost before each
    task, and publish to share a link. It is for testing whether people want the idea before you invest more.
  problem: Validating an idea usually needs a developer and weeks of work before anyone can try it.
  builds:
    - A clickable web app or Android app prototype
    - A landing page to explain the idea
    - A shareable published link
  promptHinglish: Mera idea hai — local tutors ko students se connect karna. Ek MVP web app banao jisme tutor list aur filter ho.
  promptEnglish: My idea connects local tutors with students. Build an MVP web app with a tutor list and filters.
  features: [brainstorm-and-build-modes, web-app-builder, launchpad, ads-promotion]
  faq:
    - q: Will the MVP have user accounts?
      a: Yes. App backends add user login and a database. Then showcase it on Launchpad to get feedback from early users.

agencies:
  order: 10
  title: Obsess for agencies and freelancers
  shortTitle: Agencies
  metaTitle: AI Website Builder for Agencies and Freelancers
  description: Build first drafts of client websites and apps faster by describing them. Show clients a live preview, adjust by chat, publish.
  icon: briefcase
  answer: >-
    Obsess helps agencies and freelancers create first versions of client websites and apps by
    describing them. Paste the client brief or attach it as a PDF, and the AI builds a working draft
    you can show in a live preview, change by chat and publish. Every version is saved, so you can roll back.
  problem: Agencies spend many hours on first drafts before a client gives feedback.
  builds:
    - First drafts of client sites from a brief
    - Mock-ups based on a reference screenshot
    - Quick changes during client calls
  promptHinglish: Client ka brief attach kiya hai — dental clinic ke liye 4 page website, blue aur white theme.
  promptEnglish: Client brief attached — a 4-page website for a dental clinic, blue and white theme.
  features: [website-builder, voice-and-pdf-input, photo-to-app, live-preview-version-history-undo]
  faq:
    - q: Can I hand the code to my client?
      a: Yes. Export the code as a zip or push it to GitHub, and transfer the backend to the client's account.
