# Use-case pages.

restaurant:
  order: 1
  title: Website and app for restaurants
  shortTitle: Restaurants
  metaTitle: Restaurant Website and Menu App Without Coding
  description: Build a restaurant website with your menu, timings and location by describing it in Hinglish or English. Upload your menu PDF and publish.
  icon: utensils
  answer: >-
    Obsess helps restaurant owners build a website or menu app without coding. Describe your
    restaurant in Hinglish or English, upload your menu as a PDF or photo, and the AI builds pages
    for the menu, timings, location and contact. Preview it on your phone and publish to a free address in one tap.
  problem: Customers search online before they visit, but many restaurants only have a social media page and an old printed menu. Hiring a developer for a small site is slow and costly.
  builds:
    - A menu page built from your menu PDF or photo
    - Timings, address and a call or WhatsApp contact button
    - A simple Android menu app with a phone-frame preview
  promptHinglish: Mera chhota restaurant hai Kolkata mein. Ek website banado jisme menu, timings aur location ho. Menu PDF attach kar raha hu.
  promptEnglish: I run a small restaurant in Kolkata. Build a website with our menu, timings and location. I am attaching the menu PDF.
  features: [website-builder, voice-and-pdf-input, photo-to-app, publish-and-hosting]
  faq:
    - q: Can customers order online?
      a: Yes. With App backends your site can save orders in a real database. You can also add a call or WhatsApp button.

cafe-tea:
  order: 2
  title: Website for cafés and tea stalls
  shortTitle: Cafés and tea stalls
  metaTitle: Café and Tea Stall Website — Build It by Chat
  description: Make a simple, good-looking website for your café or tea stall — menu, photos, location — by describing it in your own words.
  icon: coffee
  answer: >-
    Obsess lets café and tea stall owners make a simple website by chatting. Tell the AI your
    name, menu, prices and location in your own language, add a photo of a design you like, and it
    builds a clean page you can preview and publish. It works from a phone, so you can build between customers.
  problem: Small cafés and tea stalls rarely have time to learn website tools, and most of their day happens on a phone.
  builds:
    - One-page site with menu and prices
    - Location, timings and contact
    - A design based on a photo you like
  promptHinglish: Meri chai ki dukaan hai. Ek simple website banao — menu, rates, aur Google Maps ka location.
  promptEnglish: I have a tea stall. Make a simple website with the menu, prices and our Google Maps location.
  features: [website-builder, photo-to-app, publish-and-hosting]

eggs-farm-food:
  order: 3
  title: Website for farm and food businesses
  shortTitle: Farm and food
  metaTitle: Farm and Food Business Website — Eggs, Dairy, Produce
  description: Build a website for your eggs, dairy or produce business. Show products, prices and how to order, written in your own language.
  icon: egg
  answer: >-
    Obsess helps farm and food businesses, such as an eggs, dairy or vegetable business, get online
    without coding. Describe what you sell, your prices and the areas you deliver to, in Hinglish or
    English, and the AI builds a website showing your products and how to contact you for orders.
  problem: Farm and food sellers often take orders on calls and chat, and have no page to share that shows products, prices and delivery areas.
  builds:
    - Product and price list
    - Delivery areas and how to order (call or WhatsApp button)
    - A simple Android app version with phone-frame preview
  promptHinglish: Mera eggs business hai, website banado. Desi aur farm eggs dono bechta hu, rates aur delivery areas dikhane hai.
  promptEnglish: I have an eggs business, build me a website. I sell both country and farm eggs and want to show rates and delivery areas.
  features: [website-builder, mobile-app-builder, publish-and-hosting]
  faq:
    - q: Can the website take orders?
      a: Yes. App backends give your site a database to store orders, and you can add a call or WhatsApp button too.

car-rental:
  order: 4
  title: Website for car rental businesses
  shortTitle: Car rental
  metaTitle: Car Rental Website Without Coding — Obsess
  description: Show your cars, rates and booking contact on a website you build by chatting. Add photos, preview on your phone, publish in one tap.
  icon: car
  answer: >-
    Obsess lets car rental owners build a website that shows their cars, rates and how to book,
    without coding. Describe your fleet and prices, attach car photos or a rate list as a PDF, and
    the AI builds the pages. Preview them on your phone and publish to a free address in one tap.
  problem: Customers want to see cars and rates before they call, but a listing page with photos is hard to build and keep updated.
  builds:
    - Car listing with photos and rates
    - Booking enquiry via call or WhatsApp
    - Rate list from your PDF
  promptHinglish: Meri car rental service hai Jaipur mein. 6 gaadiyan hai, unke photo aur per-day rate ke saath website banao.
  promptEnglish: I run a car rental service in Jaipur with 6 cars. Build a website with their photos and per-day rates.
  features: [website-builder, voice-and-pdf-input, publish-and-hosting]
  faq:
    - q: Can customers book online?
      a: Yes. Use App backends to save bookings in a database, or link a call or WhatsApp button for enquiries.

mobile-shop:
  order: 5
  title: Website for mobile phone shops
  shortTitle: Mobile shops
  metaTitle: Mobile Shop Website — Show Phones, Offers, Repairs
  description: Build a website for your mobile shop with phones, accessories, repair services and offers, by describing it in your own language.
  icon: smartphone
  answer: >-
    Obsess helps mobile shop owners build a website for phones, accessories, repairs and offers,
    just by describing it. Write or speak what you sell in Hinglish or English, add your price list,
    and the AI builds the pages. You can change offers later in the same chat and publish again.
  problem: Prices and offers change often, and updating a website usually needs a developer.
  builds:
    - Product and offer pages
    - Repair services list
    - Shop location and contact
  promptHinglish: Mera mobile shop hai. Website banao jisme naye phones, accessories, repair services aur is hafte ke offers ho.
  promptEnglish: I own a mobile shop. Build a website with new phones, accessories, repair services and this week's offers.
  features: [website-builder, voice-and-pdf-input, live-preview-version-history-undo, publish-and-hosting]

retail:
  order: 6
  title: Website for retail shops
  shortTitle: Retail shops
  metaTitle: Retail Shop Website Without Coding — Obsess
  description: Put your retail shop online with products, prices and contact details. Describe it in your own words and publish in one tap.
  icon: store
  answer: >-
    Obsess helps retail shop owners, from clothing to grocery to hardware, put their shop online
    without coding. Describe your products and prices, attach a photo or a price list, and the AI
    builds a website you can preview and publish. Change it later by chatting, with every version saved.
  problem: Local shops lose customers who search online first, and building a catalogue site feels too technical.
  builds:
    - Product catalogue with prices
    - Shop details, timings and map link
